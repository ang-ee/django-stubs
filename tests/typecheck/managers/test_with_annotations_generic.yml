-   case: explicit_chronology_annotation_preserves_concrete_subclass
    main: |
        from datetime import datetime
        from typing_extensions import assert_type
        from myapp.models import Child, Other
        row = Child.objects.record_scope().get()
        assert_type(row.name, str)
        assert_type(row._order_at, datetime)
        assert_type(row.child_marker(), int)
        child: Child = row
        wrong: Other = row  # E: Incompatible types in assignment (expression has type "Child@AnnotatedWith[Chronology]", variable has type "Other")  [assignment]
        wrong_name: int = row.name  # E: Incompatible types in assignment (expression has type "str", variable has type "int")  [assignment]
        row.missing  # E: "Child@AnnotatedWith[Chronology]" has no attribute "missing"  [attr-defined]
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from __future__ import annotations
                from datetime import datetime
                from typing import TypeVar, TypedDict
                from django.db import models
                from django_stubs_ext import WithAnnotations

                T = TypeVar("T", bound="Base")
                class Chronology(TypedDict):
                    _order_at: datetime
                class Records(models.QuerySet[T]):
                    pass
                class RecordManager(models.Manager[T]):
                    def record_scope(self) -> Records[WithAnnotations[T, Chronology]]:
                        return Records(model=self.model).annotate(_order_at=models.Value(datetime.now()))
                class Base(models.Model):
                    name = models.CharField(max_length=30)
                    objects = RecordManager()
                    class Meta:
                        abstract = True
                class Child(Base):
                    def child_marker(self) -> int:
                        return 1
                class Other(models.Model):
                    pass
