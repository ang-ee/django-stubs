-   case: prefetch_heterogeneous_generic_querysets
    main: |
        from typing import TypeVar, assert_type
        from django.db.models import Prefetch, QuerySet
        from django.db.models.query import RawQuerySet
        from myapp.models import Audit, Pair, Person

        P = TypeVar("P", bound=Person)

        def check(rows: QuerySet[Pair], people: QuerySet[P], audits: QuerySet[Audit], unscoped: bool) -> None:
            result = rows.prefetch_related(
                Prefetch("audit_set", queryset=audits, to_attr="audit_rows"),
                *(Prefetch(side, queryset=people.all()) for side in ("left", "right") if not unscoped),
                *(Prefetch(side, queryset=people) for side in ("left", "right") if unscoped),
            )
            assert_type(result.get().audit_rows, list[Audit])
            rows.prefetch_related(Prefetch("audit_set", queryset=audits), Prefetch("left", queryset=people))

        def raw(rows: RawQuerySet[Pair], people: QuerySet[P], audits: QuerySet[Audit]) -> None:
            rows.prefetch_related(Prefetch("audit_set", queryset=audits), Prefetch("left", queryset=people))

        Prefetch("left", queryset=1)  # E: Argument "queryset" to "Prefetch" has incompatible type "int"; expected "QuerySet[Model, Model] | None"  [arg-type]
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models

                class Person(models.Model):
                    pass

                class Pair(models.Model):
                    left = models.ForeignKey(Person, on_delete=models.CASCADE, related_name="+")
                    right = models.ForeignKey(Person, on_delete=models.CASCADE, related_name="+")

                class Audit(models.Model):
                    pair = models.ForeignKey(Pair, on_delete=models.CASCADE)

-   case: prefetch_abstract_declared_foreign_keys
    main: |
        from django.db.models import Prefetch, QuerySet
        from myapp.models import AbstractPair, MissingConcrete

        def check(rows: QuerySet[AbstractPair]) -> None:
            rows.prefetch_related("left", Prefetch("right"))
            rows.prefetch_related("left__parent", "optional__parent", "unknown_target")
            rows.prefetch_related("left__parent__parent")
            rows.prefetch_related("typo")  # E: Cannot find "typo" on "AbstractPair" object, "typo" is an invalid parameter to "prefetch_related()"  [misc]
            rows.prefetch_related("left_id")  # E: Cannot find "left_id" on "AbstractPair" object, "left_id" is an invalid parameter to "prefetch_related()"  [misc]
            rows.prefetch_related("count")  # E: Cannot find "count" on "AbstractPair" object, "count" is an invalid parameter to "prefetch_related()"  [misc]
            rows.prefetch_related("untyped")  # E: Cannot find "untyped" on "AbstractPair" object, "untyped" is an invalid parameter to "prefetch_related()"  [misc]
            rows.prefetch_related("left__typo")  # E: Cannot find "typo" on "Person" object, "left__typo" is an invalid parameter to "prefetch_related()"  [misc]
            rows.prefetch_related("left__name")  # E: "left__name" does not resolve to an item that supports prefetching - this is an invalid parameter to "prefetch_related()"  [misc]

        MissingConcrete.objects.prefetch_related("left")  # E: Cannot find "left" on "MissingConcrete" object, "left" is an invalid parameter to "prefetch_related()"  [misc]
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from __future__ import annotations
                from typing import Any
                from django.db import models

                class Person(models.Model):
                    name = models.CharField(max_length=20)
                    parent = models.ForeignKey("self", null=True, on_delete=models.CASCADE)

                class AbstractPair(models.Model):
                    left: models.ForeignKey[Person, Person]
                    right: models.ForeignKey[Person, Person]
                    optional: models.ForeignKey[Person | None, Person | None]
                    unknown_target: models.ForeignKey[Any, Any]
                    count: models.IntegerField[int, int]
                    untyped: Any
                    class Meta:
                        abstract = True

                class MissingConcrete(AbstractPair):
                    pass

                assert not AbstractPair._meta.local_fields
