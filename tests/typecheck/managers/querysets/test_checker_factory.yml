-   case: resolved_manager_factory_preserves_checker_and_semantic_contracts
    mypy_config: |
        [mypy]
        plugins = mypy_django_plugin.main, adapter.py, mypy.plugins.proper_plugin
    installed_apps:
        - myapp
    main: |
        from typing_extensions import assert_type
        from django.db import models
        from myapp.models import BaseRow, Child, ChildRow, Row
        from myapp.querysets import AuthoredQuerySet, Rows

        assert_type(Row.records.filter(title='value').latest_of_each().tagged().get(), Row)
        assert_type(Row().records.latest_of_each().tagged().get().title, str)
        assert_type(Row.records.label(), str)
        assert_type(Row.records.get_queryset(), Rows[Row])
        assert_type(Row.other_records.other_only(), bytes)
        assert_type(Row.records.tagged().get(), Row)
        assert_type(Row.other_records.filter().other_only(), bytes)
        assert_type(Row.overridden_records.label(), str)
        assert_type(Row.overridden_records.filter(), AuthoredQuerySet[Row])
        assert_type(Row.overridden_records.get_queryset(), AuthoredQuerySet[Row])
        assert_type(Row.objects.filter().latest_of_each().tagged().get(), Row)
        assert_type(Row.objects.label(), str)
        assert_type(Row.overridden.filter(), AuthoredQuerySet[Row])
        assert_type(Row.overridden.get_queryset(), AuthoredQuerySet[Row])
        wrong: int = Row.records.get()  # E: Incompatible types in assignment (expression has type "Row", variable has type "int")  [assignment]
        Row.records.tagged(1)  # E: Too many arguments for "tagged" of "Rows"  [call-arg]

        assert_type(ChildRow.objects.child_only(), int)
        assert_type(BaseRow.objects.get(), BaseRow)
        assert_type(Row.child_records.child_only(), int)
        def requires_child(manager: Child[models.Model]) -> None:
            pass
        BaseRow.objects.child_only()  # E: "Shared1[BaseRow]" has no attribute "child_only"  [attr-defined]
        Row.base_records.child_only()  # E: "Shared1[Row]" has no attribute "child_only"  [attr-defined]
        requires_child(BaseRow.objects)  # E: Argument 1 to "requires_child" has incompatible type "Shared1[BaseRow]"; expected "Child[Model]"  [arg-type]
        requires_child(Row.base_records)  # E: Argument 1 to "requires_child" has incompatible type "Shared1[Row]"; expected "Child[Model]"  [arg-type]
    files:
        -   path: myapp/__init__.py
        -   path: myapp/querysets.py
            content: |
                from django.db import models
                from typing_extensions import Self, TypeVar

                T = TypeVar('T', bound=models.Model, covariant=True)
                class ParentQuerySet(models.QuerySet[T]):
                    def latest_of_each(self) -> Self:
                        return self
                class Rows(ParentQuerySet[T]):
                    def tagged(self) -> Self:
                        return self
                    def label(self) -> int:
                        return 1
                class AuthoredQuerySet(models.QuerySet[T]):
                    pass
