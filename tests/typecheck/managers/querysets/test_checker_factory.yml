        -   path: myapp/models.py
            content: |
                from typing import Any, ClassVar
                from typing_extensions import TypeVar, override
                from django.db import models
                from .querysets import AuthoredQuerySet, Rows
                from .other_querysets import Rows as OtherRows

                T = TypeVar('T', bound=models.Model, covariant=True)
                class CustomManager(models.Manager[T]):
                    def label(self) -> str:
                        return 'authored'
                class OverrideManager(CustomManager[T]):
                    @override
                    def filter(self, *args: Any, **kwargs: Any) -> AuthoredQuerySet[T]:
                        return self.get_queryset().filter(*args, **kwargs)
                    @override
                    def get_queryset(self) -> AuthoredQuerySet[T]:
                        return AuthoredQuerySet(self.model)
                # Preserve this real collision with the factory's default name.
                CustomManagerFromRows = 41
                SemanticManager = CustomManager.from_queryset(Rows)
                SemanticOverride = OverrideManager.from_queryset(Rows)
                class Row(models.Model):
                    title = models.CharField(max_length=30)
                    objects = SemanticManager()
                    overridden = SemanticOverride()
                    records: ClassVar[Any]
                    other_records: ClassVar[Any]
                    overridden_records: ClassVar[Any]
                    child_records: ClassVar[Any]
                    base_records: ClassVar[Any]
                class Child(models.Manager[T]):
                    def child_only(self) -> int:
                        return 1
                ChildFactory = Child.from_queryset(Rows, 'Shared')
                BaseFactory = models.Manager.from_queryset(Rows, 'Shared')
                class ChildRow(models.Model):
                    objects = ChildFactory()
                class BaseRow(models.Model):
                    objects = BaseFactory()
        -   path: adapter.py
            content: |
                from functools import partial
                from mypy.nodes import TypeInfo
                from mypy.plugin import AttributeContext, Plugin
                from mypy.types import Instance
                from mypy_django_plugin.lib import helpers
                from mypy_django_plugin.transformers.managers import create_manager_info_from_queryset

                class Adapter(Plugin):
                    def hook(self, fullname):
                        owner, _, name = fullname.rpartition('.')
                        if owner == 'myapp.models.Row' and name in {'records', 'other_records', 'overridden_records', 'child_records', 'base_records'}:
                            return partial(self.manager, name=name)
                    get_attribute_hook = hook
                    get_class_attribute_hook = hook

                    def manager(self, ctx: AttributeContext, *, name):
                        manager = self.lookup_fully_qualified(
                            'myapp.models.Child' if name == 'child_records'
                            else 'django.db.models.manager.Manager' if name == 'base_records'
                            else 'myapp.models.OverrideManager' if name == 'overridden_records'
                            else 'myapp.models.CustomManager'
                        ).node
                        queryset = self.lookup_fully_qualified(
                            'myapp.other_querysets.Rows' if name == 'other_records' else 'myapp.querysets.Rows'
                        ).node
                        row = self.lookup_fully_qualified('myapp.models.Row').node
                        assert isinstance(manager, TypeInfo) and isinstance(queryset, TypeInfo) and isinstance(row, TypeInfo)
                        module = ctx.api.modules['myapp.models']
                        factory_name = 'Shared' if name in {'child_records', 'base_records'} else None
                        authored_collision = module.names['CustomManagerFromRows']
                        generated = create_manager_info_from_queryset(module, manager, queryset, manager_name=factory_name)
                        assert create_manager_info_from_queryset(module, manager, queryset, manager_name=factory_name) is generated
                        assert module.names['CustomManagerFromRows'] is authored_collision
                        return helpers.fill_manager(generated, Instance(row, []))

                def plugin(version):
                    return Adapter
