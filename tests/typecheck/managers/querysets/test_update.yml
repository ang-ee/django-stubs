-   case: update_valid_fields
    installed_apps:
        - myapp
    main: |
        from typing import Any
        from myapp.models import Article, Author
        from django.db.models import F

        # Simple field
        Article.objects.update(title="new title")

        # Multiple fields
        Article.objects.update(title="new title", published=True)

        # FK id field (concrete)
        Article.objects.update(author_id=1)

        # FK by object
        author = Author.objects.get(pk=1)
        Article.objects.update(author=author)

        # Expression value
        Article.objects.update(title=F("content"))

        # Unpacked kwargs (skipped by validation, field names are not statically known)
        Article.objects.update(**{"title": "new title"})
        fields: dict[str, Any] = {"title": "new title"}
        Article.objects.update(**fields)

        # Chained with filter
        Article.objects.filter(published=False).update(published=True)

        # Async variant
        async def test_async() -> None:
            await Article.objects.aupdate(title="new title")
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models

                class Tag(models.Model):
                    name = models.CharField(max_length=50)

                class Author(models.Model):
                    name = models.CharField(max_length=100)

                class Article(models.Model):
                    title = models.CharField(max_length=200)
                    content = models.TextField()
                    published = models.BooleanField(default=False)
                    author = models.ForeignKey(Author, on_delete=models.CASCADE)
                    tags = models.ManyToManyField(Tag)


-   case: update_invalid_fields
    installed_apps:
        - myapp
    main: |
        from myapp.models import Article, Author
        from django.db.models import F

        # Non-existent field
        Article.objects.update(nonexistent=1)  # E: Article has no field named 'nonexistent'  [misc]

        # M2M field (not concrete)
        Article.objects.update(tags=1)  # E: "update()" can only be used with concrete fields. Got "tags"  [misc]

        # "pk" alias (not supported by `Options.get_field` at runtime)
        Article.objects.update(pk=1)  # E: Article has no field named 'pk'  [misc]

        # Reverse relation (not concrete)
        Author.objects.update(article=1)  # E: "update()" can only be used with concrete fields. Got "article"  [misc]

        # Annotated field (not supported at runtime, `Options.get_field` raises `FieldDoesNotExist`)
        Article.objects.annotate(foo=F("title")).update(foo="new")  # E: Article has no field named 'foo'  [misc]

        # Async variant with invalid field
        async def test_async() -> None:
            await Article.objects.aupdate(nonexistent=1)  # E: Article has no field named 'nonexistent'  [misc]
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models

                class Tag(models.Model):
                    name = models.CharField(max_length=50)

                class Author(models.Model):
                    name = models.CharField(max_length=100)

                class Article(models.Model):
                    title = models.CharField(max_length=200)
                    content = models.TextField()
                    published = models.BooleanField(default=False)
                    author = models.ForeignKey(Author, on_delete=models.CASCADE)
                    tags = models.ManyToManyField(Tag)


-   case: update_override_with_declared_kwargs
    installed_apps:
        - myapp
    main: |
        from myapp.models import Article

        # Kwargs declared explicitly by an `update()` override are consumed by
        # the override; only ones destined for `**kwargs` are model fields.
        Article.objects.update(title="new title", author_name="foo")
        Article.objects.update(author_name=1)  # E: Argument "author_name" to "update" of "ArticleQuerySet" has incompatible type "int"; expected "str | None"  [arg-type]
        Article.objects.update(nonexistent=1, author_name="foo")  # E: Article has no field named 'nonexistent'  [misc]
        Article.objects.count(include_archived=True)
        Article.objects.count(include_archived="yes")  # E: Argument "include_archived" to "count" of "ArticleQuerySet" has incompatible type "str"; expected "bool"  [arg-type]

        Article.plain.all().update(author_name=1)
        Article.plain.all().update(author_name="x")  # E: Argument "author_name" to "update" of "PlainQuerySet" has incompatible type "str"; expected "int | None"  [arg-type]
        Article.plain.update(author_name="x")  # E: Argument "author_name" to "update" of "PlainQuerySet" has incompatible type "str"; expected "int | None"  [arg-type]
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from typing import Any

                from django.db import models
                from typing_extensions import override

                class ArticleQuerySet(models.QuerySet["Article"]):
                    @override
                    def update(self, *, author_name: str | None = None, **kwargs: Any) -> int:
                        return super().update(**kwargs)

                    @override
                    def count(self, *, include_archived: bool = False) -> int:
                        return super().count()

                class PlainQuerySet(models.QuerySet["Article"]):
                    @override
                    def update(self, *, author_name: int | None = None, **kwargs: Any) -> int:
                        return super().update(**kwargs)

                class Article(models.Model):
                    title = models.CharField(max_length=200)
                    objects = ArticleQuerySet.as_manager()
                    plain = PlainQuerySet.as_manager()

