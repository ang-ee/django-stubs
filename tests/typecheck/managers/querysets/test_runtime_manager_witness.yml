-   case: runtime_manager_witness_preserves_real_and_unknown_overrides
    mypy_config: |
        [mypy]
        plugins = mypy_django_plugin.main, adapter.py, mypy.plugins.proper_plugin
    installed_apps:
        - myapp
    main: |
        from typing import TYPE_CHECKING
        from typing_extensions import TypeVar, assert_type
        from django.db import models
        from myapp.models import Row, ElseRow, DynamicRow, InheritedRow, AdvertisedRow
        from myapp.querysets import Rows, IntegerRows

        assert_type(Row.objects.tagged(), Rows[Row])
        assert_type(Row.objects.tagged().custom(), bool)
        assert_type(Row.objects.get_queryset(), Rows[Row])
        assert_type(Row.inline.tagged(), Rows[Row])
        assert_type(Row.late.tagged().custom(), bool)
        assert_type(Row.early.tagged().custom(), bool)
        assert_type(ElseRow.objects.tagged(), str)
        assert_type(DynamicRow.objects.tagged(), str)
        assert_type(InheritedRow.objects.tagged(), str)
        assert_type(AdvertisedRow.objects.tagged(), str)
        Row.objects.tagged().absent()  # E: "Rows[Row]" has no attribute "absent"  [attr-defined]

        T = TypeVar('T', bound=models.Model, covariant=True)
        class UnknownManager(models.Manager[T]):
            if TYPE_CHECKING:
                def tagged(self) -> str: ...
        UnknownFactory = UnknownManager.from_queryset(IntegerRows)
        # No corresponding runtime class is known to Django: remain conservative.
        assert_type(UnknownFactory[Row]().tagged(), str)
    files:
        -   path: myapp/__init__.py
        -   path: myapp/querysets.py
            content: |
                from django.db import models
                from typing_extensions import Self, TypeVar

                T = TypeVar('T', bound=models.Model, covariant=True)
                class BaseRows(models.QuerySet[T]):
                    def tagged(self) -> Self:
                        return self
                class Rows(BaseRows[T]):
                    def custom(self) -> bool:
                        return True
                class IntegerRows(models.QuerySet[T]):
                    def tagged(self) -> int:
                        return 1
        -   path: myapp/models.py
            content: |
                from typing import Any, ClassVar, TYPE_CHECKING
                from typing_extensions import TypeVar, override
                from django.db import models
                from .querysets import BaseRows, Rows, IntegerRows

                T = TypeVar('T', bound=models.Model, covariant=True)
                BaseFactory = models.Manager.from_queryset(BaseRows)
                class EditorManager(BaseFactory[T]):
                    if TYPE_CHECKING:
                        @override
                        def tagged(self) -> BaseRows[T]: ...
                        @override
                        def get_queryset(self) -> BaseRows[T]: ...
                Factory = EditorManager.from_queryset(Rows)
                class Row(models.Model):
                    objects = Factory()
                    inline = EditorManager.from_queryset(Rows)()
                    late: ClassVar[Any]
                    early: ClassVar[Any]
                class ElseManager(models.Manager[T]):
                    if TYPE_CHECKING:
                        def tagged(self) -> str: ...
                    else:
                        def tagged(self):
                            return 'manager'
                ElseFactory = ElseManager.from_queryset(IntegerRows)
                class ElseRow(models.Model):
                    objects = ElseFactory()
                class DynamicManager(models.Manager[T]):
                    if TYPE_CHECKING:
                        def tagged(self) -> str: ...
                def runtime_tagged(self: Any) -> str:
                    return 'dynamic-manager'
                setattr(DynamicManager, 'tagged', runtime_tagged)
                DynamicFactory = DynamicManager.from_queryset(IntegerRows)
                class DynamicRow(models.Model):
                    objects = DynamicFactory()
                class ManagerMeta(type):
                    def __getattr__(cls, name: str) -> Any:
                        if name == 'tagged':
                            return runtime_tagged
                        raise AttributeError(name)
                class AdvertisedManager(models.Manager[T], metaclass=ManagerMeta):
                    if TYPE_CHECKING:
                        def tagged(self) -> str: ...
                AdvertisedFactory = AdvertisedManager.from_queryset(IntegerRows)
                class AdvertisedRow(models.Model):
                    objects = AdvertisedFactory()
                class ParentManager(models.Manager[T]):
                    def tagged(self) -> str:
                        return 'parent'
                class SignatureManager(ParentManager[T]):
                    if TYPE_CHECKING:
                        @override
                        def tagged(self) -> str: ...
                InheritedFactory = SignatureManager.from_queryset(IntegerRows)
                class InheritedRow(models.Model):
                    objects = InheritedFactory()
        -   path: adapter.py
            content: |
                from functools import partial
                from mypy.nodes import TypeInfo
                from mypy.plugin import AttributeContext, Plugin
                from mypy.types import Instance
                from mypy_django_plugin.lib import helpers
                from mypy_django_plugin.transformers.managers import create_manager_info_from_queryset

                class Adapter(Plugin):
                    def hook(self, fullname):
                        owner, _, name = fullname.rpartition('.')
                        if owner == 'myapp.models.Row' and name in {'late', 'early'}:
                            return partial(self.manager, name=name)
                    get_attribute_hook = hook
                    get_class_attribute_hook = hook

                    def manager(self, ctx: AttributeContext, *, name):
                        from myapp.models import EditorManager
                        manager = self.lookup_fully_qualified('myapp.models.EditorManager').node
                        queryset = self.lookup_fully_qualified('myapp.querysets.Rows').node
                        row = self.lookup_fully_qualified('myapp.models.Row').node
                        assert isinstance(manager, TypeInfo) and isinstance(queryset, TypeInfo) and isinstance(row, TypeInfo)
                        module = ctx.api.modules['myapp.models']
                        # Cold/warm calls, with or without the known runtime witness,
                        # converge to one native symbol for each identical factory.
                        before = create_manager_info_from_queryset(module, manager, queryset, manager_name=name,
                            runtime_manager=EditorManager if name == 'early' else None)
                        generated = create_manager_info_from_queryset(module, manager, queryset, manager_name=name,
                            runtime_manager=EditorManager)
                        assert generated is before
                        assert create_manager_info_from_queryset(module, manager, queryset, manager_name=name) is generated
                        return helpers.fill_manager(generated, Instance(row, []))

                def plugin(version):
                    return Adapter
