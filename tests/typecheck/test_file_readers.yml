-   case: test_file_accepts_native_readers_and_preserves_text_binary_output
    main: |
        from io import BytesIO, StringIO, RawIOBase
        from typing import Iterator, assert_type
        from typing_extensions import override
        from django.core.files.base import File, ContentFile

        class BinaryReader:
            def read(self, size: int = -1) -> bytes:
                return b""
        class TextReader:
            def read(self, size: int = -1) -> str:
                return ""
        class RawReader(RawIOBase):
            @override
            def read(self, size: int = -1) -> bytes:
                return b""
        class NoRead:
            pass
        class WrongRead:
            def read(self, size: int = -1) -> int:
                return 1

        assert_type(File(BytesIO()), File[bytes])
        assert_type(File(StringIO()), File[str])
        assert_type(File(ContentFile(b"data")), File[bytes])
        assert_type(File(BinaryReader()), File[bytes])
        assert_type(File(TextReader()), File[str])
        assert_type(File(RawReader()), File[bytes])
        assert_type(File(BinaryReader()).chunks(), Iterator[bytes])
        assert_type(File(TextReader()).chunks(), Iterator[str])
        File(NoRead())
        File(WrongRead())
    out: |
        main:30: error: No overload variant of "File" matches argument type "NoRead"  [call-overload]
