-   case: test_choices_functional_factory_uses_native_enum_signature
    main: |
        from typing_extensions import assert_type
        from django.db.models import TextChoices, IntegerChoices
        def make(name: str, members: list[tuple[str, tuple[str,str]]]) -> type[TextChoices]:
            return TextChoices(name, members)
        def integer(name: str, members: dict[str,int]) -> type[IntegerChoices]:
            return IntegerChoices(name, members)
        assert_type(TextChoices('Mode', [('A', ('a','A'))]), type[TextChoices])
        assert_type(TextChoices('Mode', {'A':('a','A')}), type[TextChoices])
        assert_type(TextChoices('Mode', 'A B'), type[TextChoices])
        class Mode(TextChoices):
            A = 'a', 'A'
        assert_type(Mode('a'), Mode)
        assert_type(Mode.A.label, str)
        TextChoices(3, {'A':('a','A')})
        IntegerChoices('Mode', {'A':1}, module=3)
