-   case: model_from_db_preserves_native_fetch_mode_contract
    main: |
        from typing import Any, Self
        from collections.abc import Collection
        from django.db import models
        from django.db.models.fetch_modes import FETCH_PEERS, FetchMode
        from typing_extensions import assert_type, override
        from myapp.models import Row

        assert_type(Row.from_db("default", ["id"], [1], fetch_mode=FETCH_PEERS), Row)
        assert_type(Row()._state.fetch_mode, FetchMode)

        class Custom(Row):
            @classmethod
            @override
            def from_db(
                cls, db: str | None, field_names: Collection[str], values: Collection[Any],
                *, fetch_mode: FetchMode | None = None,
            ) -> Self:
                return super().from_db(db, field_names, values, fetch_mode=fetch_mode)
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models

                class Row(models.Model):
                    pass
